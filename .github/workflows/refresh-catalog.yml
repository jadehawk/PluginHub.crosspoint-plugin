name: Refresh Plugin Catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"
  push:
    branches:
      - main
    paths:
      - "tools/build_catalog.py"
      - "tests/**"
      - "plugin.js"
      - "manifest.json"
      - "whitelist.json"
      - ".github/workflows/refresh-catalog.yml"

permissions:
  contents: write

concurrency:
  group: pluginhub-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync current main
        shell: bash
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run catalog tests
        run: python -m unittest discover -s tests -v

      - name: Run browser plugin tests
        run: node --test tests/test_plugin_js.mjs

      - name: Build catalog
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/build_catalog.py

      - name: Commit catalog and release-asset changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json release-assets
          if git diff --cached --quiet; then
            echo "Catalog and release-asset mirror are unchanged."
            exit 0
          fi
          git commit -m "chore: refresh plugin catalog"
          git pull --rebase origin main
          git push origin HEAD:main
